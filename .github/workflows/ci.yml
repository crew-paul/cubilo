name: Native checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build -p studio-app --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: cubilo-${{ matrix.os }}
          path: |
            target/release/studio-app
            target/release/studio-app.exe
            assets/fonts/OFL-NanumGothic.txt
          if-no-files-found: error
